name: tests

on:
  push:
  pull_request:

jobs:
  python:
    # Host-independent suites: protocol, client and server. The PF ioctl and
    # live-firewall suites skip here by design and need an OpenBSD host.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r server-python/requirements.txt
          python -m pip install -r client-unbound/requirements.txt
      - name: Run tests
        run: python -m pytest -v
      - name: Check both daemons parse
        run: python -m py_compile server-python/pfui_firewall.py client-unbound/pfui_unbound.py

  server-c:
    # Builds the C framing implementation and runs the same conformance vectors
    # as the Python one, so the two cannot drift apart unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run protocol vectors
        run: make -C server-c test

  server-rust:
    # Runs on the exact rustc OpenBSD-stable ports ships (rust-version in
    # Cargo.toml), so post-MSRV code fails here rather than on the firewall.
    # Both vector suites run inside cargo test.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-rust
    steps:
      - uses: actions/checkout@v4
      - name: Pin the OpenBSD ports toolchain
        run: |
          rustup toolchain install 1.94 --profile minimal -c clippy -c rustfmt
          rustup default 1.94
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  unbound-container:
    # The only job that answers "does Unbound still build with the Python module,
    # and does its pythonmod still call PFUI's entry points". Everything else
    # tests PFUI against fakes; this builds the Unbound release the installer
    # resolves and runs PFUI_Unbound inside it, so upstream API drift surfaces
    # here rather than during someone's install.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 'latest' is what the installer builds by default. 'master' is what it
        # builds on request, and is informational: upstream head is occasionally
        # unstable, which is why the installer can be pinned to a release.
        unbound: [latest, master]
    continue-on-error: ${{ matrix.unbound == 'master' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Unbound with the Python module and run PFUI_Unbound in it
        run: ./client-unbound/tests/container/run.sh ${{ matrix.unbound }}

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check the installers and ops scripts
        run: |
          for f in *.sh client-unbound/tools/*.sh \
                   client-unbound/tests/container/*.sh; do bash -n "$f"; done
      - name: Syntax-check the rc.d scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ksh
          for f in client-unbound/rc.d/* server-python/rc.d/* server-rust/rc.d/*; do ksh -n "$f"; done
