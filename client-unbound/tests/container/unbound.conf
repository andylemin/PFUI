# Unbound configuration for the PFUI_Unbound build-and-run test container.
#
# Deliberately close to examples/pfui_unbound.conf where it matters - the module
# chain, chroot and the Python stanza - and stripped everywhere it does not, so a
# failure points at PFUI rather than at a tuning option.

server:
    # PFUI_Unbound does not support a chroot'ed environment
    chroot: ""
    directory: "/var/unbound/etc"
    username: "_unbound"
    pidfile: ""
    verbosity: 2
    use-syslog: no
    logfile: ""

    interface: 127.0.0.1
    port: 5353
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    access-control: 127.0.0.0/8 allow

    # The authoritative server for the test zone is on loopback, which Unbound
    # refuses to query by default
    do-not-query-localhost: no

    # The test zone is unsigned and outside the root, and no trust anchor is
    # configured, so the validator treats everything as insecure
    domain-insecure: "pfui-test."

    # One query must produce one lookup, so the assertions can be exact
    qname-minimisation: no
    prefetch: no
    cache-min-ttl: 0
    rrset-roundrobin: no
    minimal-responses: yes

    # PFUI is invoked by the python module after the iterator finishes
    module-config: "validator python iterator"

python:
    python-script: "/var/unbound/etc/pfui_unbound.py"

forward-zone:
    name: "pfui-test."
    forward-addr: 127.0.0.1@5354
