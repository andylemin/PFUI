# Authoritative server for the test zone, so the resolver has something real to
# resolve. Nothing here is PFUI: it exists only so that an answer reaches the
# iterator and so MODULE_EVENT_MODDONE fires the way it does in production.
# A local-zone in Unbound would not do: those are answered before the module
# chain runs, so PFUI would never see them.

server:
    ip-address: 127.0.0.1@5354
    do-ip6: no
    username: ""
    zonesdir: "/etc/nsd"
    database: ""          # Zones are read from the zonefile, no nsd.db needed
    pidfile: "/tmp/nsd.pid"
    logfile: "/tmp/nsd.log"
    verbosity: 1

zone:
    name: "pfui-test."
    zonefile: "pfui-test.zone"
